<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أثر التعليمية - تسجيل طالب جديد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { 
            background-color: #070707;
            background-image: url("data:image/svg+xml,%3Csvg width='180' height='180' viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23d4af37' fill-opacity='0.08'%3E%3Ctext x='15' y='35' font-size='22'%3E𓋹 𓁹 𓊖%3E%3C/text%3E%3Ctext x='95' y='35' font-size='22'%3E𓏏 𓆣 𓃭%3E%3C/text%3E%3Ctext x='15' y='85' font-size='22'%3E𓍝 𓤎 𓎛%3E%3C/text%3E%3Ctext x='95' y='85' font-size='22'%3E𓂋 𓈖 𓂻%3E%3C/text%3E%3Ctext x='15' y='135' font-size='22'%3E𓅓 𓃀 𓆑%3E%3C/text%3E%3Ctext x='95' y='135' font-size='22'%3E𓈙 𓋴 𓍯%3E%3C/text%3E%3Ctext x='15' y='175' font-size='22'%3E𓎡 𓏠 𓐍%3E%3C/text%3E%3Ctext x='95' y='175' font-size='22'%3E𓃒 𓃗 𓂝%3E%3C/text%3E%3C/g%3E%3C/svg%3E");
            color: #f3f4f6; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }
        .form-container { 
            background: rgba(14, 14, 14, 0.96); 
            border: 2px solid #d4af37; 
            width: 100%; 
            max-width: 520px; 
            padding: 35px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.25); 
        }
        .header-title { 
            font-size: 23px; 
            font-weight: 700; 
            color: #d4af37; 
            text-align: center; 
            margin-bottom: 25px; 
            border-bottom: 2px solid rgba(212, 175, 55, 0.3); 
            padding-bottom: 15px; 
        }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #e5e7eb; font-size: 14px; }
        input, select { 
            width: 100%; 
            padding: 12px 15px; 
            background: #111; 
            border: 1px solid #4b5563; 
            border-radius: 10px; 
            color: #fff; 
            font-size: 14px; 
            transition: 0.3s;
        }
        input:focus, select:focus { 
            border-color: #d4af37; 
            outline: none; 
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); 
        }
        .btn-submit { 
            width: 100%; 
            background: linear-gradient(135deg, #d4af37, #b45309); 
            color: #000; 
            border: none; 
            padding: 14px; 
            border-radius: 10px; 
            font-weight: 700; 
            font-size: 16px; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 10px; 
        }
        .btn-submit:hover { 
            background: linear-gradient(135deg, #eab308, #d97706); 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(234, 179, 8, 0.3);
        }
        .success-box { 
            display: none; 
            text-align: center; 
            padding: 20px 10px;
        }
        .success-box .icon { font-size: 45px; margin-bottom: 10px; }
        .success-box h3 { color: #d4af37; font-size: 20px; margin-bottom: 10px; }
        .success-box p { color: #e5e7eb; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="header-title">🏛️ تسجيل طالب جديد - منصة أثر</div>
        
        <form id="studentForm" onsubmit="registerStudent(event)">
            <div class="form-group">
                <label>اسم الطالب الرباعي:</label>
                <input type="text" id="name" required placeholder="أدخل اسم الطالب كاملاً">
            </div>
            
            <div class="form-group">
                <label>الصف الدراسي:</label>
                <select id="grade" required>
                    <option value="">اختر الصف الدراسي</option>
                    <optgroup label="المرحلة الإعدادية">
                        <option value="الصف الأول الإعدادي">الصف الأول الإعدادي</option>
                        <option value="الصف الثاني الإعدادي">الصف الثاني الإعدادي</option>
                        <option value="الصف الثالث الإعدادي">الصف الثالث الإعدادي</option>
                    </optgroup>
                    <optgroup label="المرحلة الثانوية">
                        <option value="الصف الأول الثانوي">الصف الأول الثانوي</option>
                        <option value="الصف الثاني الثانوي">الصف الثاني الثانوي</option>
                        <option value="الصف الثالث الثانوي">الصف الثالث الثانوي</option>
                    </optgroup>
                    <optgroup label="المرحلة الجامعية">
                        <option value="طالب جامعي">طالب جامعي</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label>المركز / المحافظة:</label>
                <input type="text" id="center" required placeholder="مثال: سوهاج، أخميم، طهطا...">
            </div>
            
            <div class="form-group">
                <label>رقم الهاتف للتواصل:</label>
                <input type="tel" id="phone" required placeholder="رقم الهاتف">
            </div>

            <div class="form-group">
                <label>الحالة المالية:</label>
                <select id="financialStatus" onchange="toggleProofField()" required>
                    <option value="مقتدر">مقتدر</option>
                    <option value="غير مقتدر">غير مقتدر</option>
                </select>
            </div>

            <div class="form-group" id="proofGroup" style="display: none;">
                <label>رفع إثبات الحالة (بحث اجتماعي أو مستند معتمد):</label>
                <input type="file" id="proofFile" accept="image/*,.pdf">
            </div>

            <div class="form-group">
                <label>طريقة الدفع:</label>
                <select id="paymentMethod" required>
                    <option value="فودافون كاش">فودافون كاش</option>
                    <option value="إنستا باي (InstaPay)">إنستا باي (InstaPay)</option>
                </select>
            </div>

            <div class="form-group">
                <label>رقم الهاتف المحول منه (أو الحساب):</label>
                <input type="text" id="senderPhone" required placeholder="اكتب رقم الهاتف أو الحساب الذي تم التحويل منه">
            </div>

            <div class="form-group">
                <label>صورة إيصال الدفع:</label>
                <input type="file" id="receiptFile" accept="image/*" required>
            </div>

            <button type="submit" class="btn-submit">إرسال طلب التسجيل 🪶</button>
        </form>

        <div id="successMsg" class="success-box">
            <div class="icon">🏛️✨</div>
            <h3>شكرا! تم تسجيلك بنجاح</h3>
            <p>
                تم حفظ بياناتك وإرسالها مباشرة لوحة تحكم المسؤول.
                <br><br>
                <strong style="color: #d4af37; font-size: 16px;" id="assignedCode"></strong>
                <br><br>
                <!-- تم إزالة الباركود نهائياً من هنا بناءً على طلبك -->
            </p>
        </div>
    </div>

    <script>
        function toggleProofField() {
            let status = document.getElementById('financialStatus').value;
            let proofGroup = document.getElementById('proofGroup');
            proofGroup.style.display = (status === 'غير مقتدر') ? 'block' : 'none';
        }

        async function registerStudent(e) {
            e.preventDefault();
            let name = document.getElementById('name').value;
            let grade = document.getElementById('grade').value;
            let center = document.getElementById('center').value;
            let phone = document.getElementById('phone').value;
            let financialStatus = document.getElementById('financialStatus').value;
            let paymentMethod = document.getElementById('paymentMethod').value;
            let senderPhone = document.getElementById('senderPhone').value;
            let fileInput = document.getElementById('receiptFile');

            let reader = new FileReader();
            reader.onload = async function(event) {
                let base64Image = event.target.result;
                let studentCode = 'ATHAR-' + Math.floor(1000 + Math.random() * 9000);
                
                let newStudent = {
                    id: Date.now(),
                    name: name,
                    grade: grade,
                    center: center,
                    phone: phone,
                    financialStatus: financialStatus,
                    paymentMethod: paymentMethod,
                    senderPhone: senderPhone,
                    fileImage: base64Image,
                    code: studentCode,
                    status: 'قيد المراجعة',
                    date: new Date().toLocaleDateString('ar-EG')
                };

                let students = JSON.parse(localStorage.getItem('atharStudents')) || [];
                students.push(newStudent);
                localStorage.setItem('atharStudents', JSON.stringify(students));

                document.getElementById('studentForm').style.display = 'none';
                document.getElementById('successMsg').style.display = 'block';
                document.getElementById('assignedCode').innerText = "كود الطالب: " + studentCode;
            };

            if(fileInput.files[0]) {
                reader.readAsDataURL(fileInput.files[0]);
            }
        }
    </script>
</body>
</html>
