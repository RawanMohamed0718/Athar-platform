<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أثر التعليمية - التحقق من الكارنيه</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { 
            background: linear-gradient(135deg, #0a0a0a, #1a150b, #000); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
        }
        .card { 
            background: rgba(18, 18, 18, 0.95); 
            border: 2px solid #d4af37; 
            width: 100%; 
            max-width: 450px; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(212, 175, 55, 0.2); 
            text-align: right; 
        }
        .header-title { 
            font-size: 20px; 
            font-weight: 700; 
            color: #d4af37; 
            text-align: center; 
            margin-bottom: 20px; 
            border-bottom: 2px solid rgba(212, 175, 55, 0.3); 
            padding-bottom: 12px; 
        }
        .info-group { 
            margin-bottom: 14px; 
            font-size: 14px; 
            color: #e5e7eb; 
            background: #161616; 
            padding: 10px 14px; 
            border-radius: 8px; 
            border: 1px solid rgba(212, 175, 55, 0.2); 
        }
        .info-group span { font-weight: 700; color: #d4af37; }
        .status-badge { text-align: center; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; margin-top: 15px; }
        .status-valid { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #10b981; }
        .status-expired { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; }
        .error-msg { text-align: center; color: #ef4444; font-weight: bold; font-size: 15px; padding: 20px; background: rgba(239, 68, 68, 0.1); border-radius: 8px; border: 1px solid #ef4444; }
    </style>
</head>
<body>

    <div class="card" id="cardContainer">
        <div class="header-title">🏛️ بطاقة التحقق - منصة أثر</div>
        <div id="studentDetails">
            <div class="info-group">اسم الطالب: <span id="sName">-</span></div>
            <div class="info-group">الصف الدراسي: <span id="sGrade">-</span></div>
            <div class="info-group">المركز / المحافظة: <span id="sCenter">-</span></div>
            <div class="info-group">كود التفعيل: <span id="sCode">-</span></div>
            <div class="info-group">تاريخ الاعتماد: <span id="sDate">-</span></div>
            <div class="info-group">المتبقي من الاشتراك: <span id="sDaysLeft">-</span></div>
            
            <div id="statusAlert" class="status-badge">جاري التحقق من الكارنيه...</div>
        </div>
    </div>

    <script>
        function getQueryParam(param) {
            let urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        let studentCode = getQueryParam('code');
        let paramName = getQueryParam('name');
        let paramGrade = getQueryParam('grade');
        let paramCenter = getQueryParam('center');
        let container = document.getElementById('cardContainer');

        if (!studentCode) {
            container.innerHTML = `<div class="header-title">تنبيه</div><div class="error-msg">⚠️ يرجى مسح باركود صحيح الخاص بالكارنيه.</div>`;
        } else {
            let students = JSON.parse(localStorage.getItem('atharStudents')) || [];
            let student = students.find(s => s.code === studentCode);

            let finalName = student ? student.name : (paramName ? decodeURIComponent(paramName) : "طالب غير مسجل");
            let finalGrade = student ? student.grade : (paramGrade ? decodeURIComponent(paramGrade) : "غير محدد");
            let finalCenter = student ? student.center : (paramCenter ? decodeURIComponent(paramCenter) : "سوهاج");
            let approvalDate = new Date(student && student.approvalDate ? student.approvalDate : Date.now());

            document.getElementById('sName').innerText = finalName;
            document.getElementById('sGrade').innerText = finalGrade;
            document.getElementById('sCenter').innerText = finalCenter;
            document.getElementById('sCode').innerText = studentCode;

            let alertBox = document.getElementById('statusAlert');
            let daysLeftSpan = document.getElementById('sDaysLeft');

            let currentDate = new Date();
            let diffDays = Math.floor((currentDate - approvalDate) / (1000 * 60 * 60 * 24));
            let daysLeft = 30 - diffDays;

            document.getElementById('sDate').innerText = approvalDate.toLocaleDateString('ar-EG');

            if (daysLeft >= 0) {
                daysLeftSpan.innerText = daysLeft + " يوم متبقي";
                daysLeftSpan.style.color = "#10b981";
                alertBox.className = "status-badge status-valid";
                alertBox.innerText = "✅ اشتراك الكارنيه ساري ومفعل بنجاح";
            } else {
                daysLeftSpan.innerText = "انتهت الصلاحية";
                daysLeftSpan.style.color = "#ef4444";
                alertBox.className = "status-badge status-expired";
                alertBox.innerText = "❌ انتهت فترة صلاحية هذا الكارنيه.";
            }
        }
    </script>
</body>
</html>
