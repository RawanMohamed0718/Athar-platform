<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أثر التعليمية - التحقق من الكارنيه</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: linear-gradient(135deg, #064e3b, #022c22, #111827); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: #ffffff; width: 100%; max-width: 450px; padding: 30px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); text-align: right; position: relative; overflow: hidden; }
        .header-title { font-size: 20px; font-weight: 700; color: #064e3b; text-align: center; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 12px; }
        .info-group { margin-bottom: 14px; font-size: 14px; color: #374151; background: #f9fafb; padding: 10px 14px; border-radius: 8px; border: 1px solid #e5e7eb; }
        .info-group span { font-weight: 700; color: #059669; }
        
        /* حالات الإنذار والقبول */
        .status-badge { text-align: center; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 14px; margin-top: 15px; }
        .status-valid { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .status-warning { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; animation: pulse 1.5s infinite; }
        .status-expired { background: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
        .status-pending { background: #fef3c7; color: #d97706; border: 1px solid #fde68a; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        
        .error-msg { text-align: center; color: #dc2626; font-weight: bold; font-size: 16px; padding: 20px; }
    </style>
</head>
<body>

    <div class="card" id="cardContainer">
        <div class="header-title">بطاقة التحقق - منصة أثر</div>
        <div id="studentDetails">
            <div class="info-group">اسم الطالب: <span id="sName">-</span></div>
            <div class="info-group">الصف الدراسي: <span id="sGrade">-</span></div>
            <div class="info-group">المركز / المحافظة: <span id="sCenter">-</span></div>
            <div class="info-group">كود التفعيل: <span id="sCode">-</span></div>
            <div class="info-group">تاريخ الاعتماد: <span id="sDate">-</span></div>
            <div class="info-group">المتبقي من الاشتراك: <span id="sDaysLeft">-</span></div>
            
            <div id="statusAlert" class="status-badge">جاري التحقق من الحالة...</div>
        </div>
    </div>

    <script>
        function getQueryParam(param) {
            let urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        let studentCode = getQueryParam('code');
        let students = JSON.parse(localStorage.getItem('atharStudents')) || [];
        let student = students.find(s => s.code === studentCode);

        let container = document.getElementById('cardContainer');

        if (!student) {
            container.innerHTML = `<div class="error-msg">❌ عذراً، كود الطالب غير مسجل أو غير متوالٍ لقواعد البيانات في المنصة.</div>`;
        } else {
            document.getElementById('sName').innerText = student.name;
            document.getElementById('sGrade').innerText = student.grade;
            document.getElementById('sCenter').innerText = student.center || 'غير محدد';
            document.getElementById('sCode').innerText = student.code;

            let alertBox = document.getElementById('statusAlert');
            let daysLeftSpan = document.getElementById('sDaysLeft');

            // التحقق مما إذا تم اعتماد الطالب من قبل الإدارة أم لا
            if (!student.isApproved || !student.approvalDate) {
                document.getElementById('sDate').innerText = "قيد المراجعة";
                daysLeftSpan.innerText = "لم يبدأ العداد بعد";
                daysLeftSpan.style.color = "#d97706";
                alertBox.className = "status-badge status-pending";
                alertBox.innerText = "⏳ تنبيه: الطالب في انتظار المراجعة واعتماد الإدارة لتفعيل الاشتراك.";
            } else {
                // حساب الأيام منذ تاريخ الاعتماد (مدة الصلاحية 30 يوماً)
                let approvalDate = new Date(student.approvalDate);
                let currentDate = new Date();
                let diffTime = currentDate - approvalDate;
                let diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                let daysLeft = 30 - diffDays;

                let formattedDate = approvalDate.toLocaleDateString('ar-EG');
                document.getElementById('sDate').innerText = formattedDate;

                if (daysLeft > 3) {
                    daysLeftSpan.innerText = daysLeft + " يوم متبقي";
                    daysLeftSpan.style.color = "#059669";
                    alertBox.className = "status-badge status-valid";
                    alertBox.innerText = "✅ اشتراك الطالب ساري ومفعل بنجاح";
                } else if (daysLeft >= 0 && daysLeft <= 3) {
                    daysLeftSpan.innerText = daysLeft + " أيام متبقية (ينتهي قريباً!)";
                    daysLeftSpan.style.color = "#dc2626";
                    alertBox.className = "status-badge status-warning";
                    alertBox.innerText = `⚠️ تنبيه هام: متبقي ${daysLeft} أيام فقط على انتهاء اشتراك الطالب، يرجى التجديد فوراً!`;
                } else {
                    daysLeftSpan.innerText = "انتهت الصلاحية";
                    daysLeftSpan.style.color = "#991b1b";
                    alertBox.className = "status-badge status-expired";
                    alertBox.innerText = "❌ انتهت فترة الاشتراك (أكثر من 30 يوماً)، يتطلب التجديد!";
                }
            }
        }
    </script>
</body>
</html>
