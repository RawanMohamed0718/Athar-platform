<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أثر التعليمية - لوحة التحكم الإدارية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { 
            background-color: #070707;
            /* خلفية هيروغليفية فرعونية واضحة وثابتة في المساحات الفارغة للوحة التحكم */
            background-image: url("data:image/svg+xml,%3Csvg width='180' height='180' viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23d4af37' fill-opacity='0.08'%3E%3Ctext x='15' y='35' font-size='22'%3E𓋹 𓁹 𓊖%3E%3C/text%3E%3Ctext x='95' y='35' font-size='22'%3E𓏏 𓆣 𓃭%3E%3C/text%3E%3Ctext x='15' y='85' font-size='22'%3E𓍝 𓤎 𓎛%3E%3C/text%3E%3Ctext x='95' y='85' font-size='22'%3E𓂋 𓈖 𓂻%3E%3C/text%3E%3Ctext x='15' y='135' font-size='22'%3E𓅓 𓃀 𓆑%3E%3C/text%3E%3Ctext x='95' y='135' font-size='22'%3E𓈙 𓋴 𓍯%3E%3C/text%3E%3Ctext x='15' y='175' font-size='22'%3E𓎡 𓏠 𓐍%3E%3C/text%3E%3Ctext x='95' y='175' font-size='22'%3E𓃒 𓃗 𓂝%3E%3C/text%3E%3C/g%3E%3C/svg%3E");
            color: #f3f4f6; 
            padding: 20px; 
            position: relative;
            min-height: 100vh;
        }
        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
            background: rgba(14, 14, 14, 0.96); 
            border: 2px solid #d4af37; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2); 
            position: relative;
            z-index: 1;
        }
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid rgba(212, 175, 55, 0.3); 
            padding-bottom: 15px; 
            margin-bottom: 25px; 
            flex-wrap: wrap; 
            gap: 15px; 
        }
        .logo-title { font-size: 22px; font-weight: 700; color: #d4af37; letter-spacing: 0.5px; }
        .actions-bar { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { 
            background: linear-gradient(135deg, #d4af37, #b45309); 
            color: #000; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 8px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: 0.3s; 
            text-decoration: none; 
            display: inline-block; 
            font-size: 14px; 
        }
        .btn:hover { background: #eab308; transform: translateY(-1px); }
        .btn-whatsapp { background: linear-gradient(135deg, #10b981, #047857); color: #fff; }
        .btn-whatsapp:hover { background: #059669; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { 
            background: #161616; 
            border: 1px solid rgba(212, 175, 55, 0.3); 
            padding: 18px; 
            border-radius: 12px; 
            text-align: center; 
        }
        .stat-card h3 { font-size: 13px; color: #9ca3af; margin-bottom: 5px; }
        .stat-card .number { font-size: 24px; font-weight: 700; color: #d4af37; }
        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: right; min-width: 1100px; }
        th, td { padding: 12px 10px; border-bottom: 1px solid #262626; font-size: 13px; vertical-align: middle; }
        th { background: rgba(212, 175, 55, 0.1); color: #d4af37; font-weight: 700; }
        .status-pending { background: rgba(245, 158, 11, 0.15); color: #f59e0b; padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-approved { background: rgba(16, 185, 129, 0.15); color: #10b981; padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-financial { background: rgba(59, 130, 246, 0.15); color: #60a5fa; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .badge-poor { background: rgba(168, 85, 247, 0.15); color: #c084fc; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .qr-wrapper { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .qr-box { width: 60px; height: 60px; cursor: pointer; background: #fff; padding: 3px; border-radius: 4px; }
        .receipt-img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1px solid #d4af37; }
        .action-btns { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
        .btn-approve { background: #10b981; color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .btn-download-qr { background: #3b82f6; color: white; border: none; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-title">🏛️ لوحة تحكم منصة أثر التعليمية (إدارة سوهاج)</div>
            <div class="actions-bar">
                <a href="rigister.html" target="_blank" class="btn">تسجيل طالب جديد 🪶</a>
                <button class="btn btn-whatsapp" onclick="sendWhatsAppReport()">إرسال التقارير للمدير 📱</button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي الطلاب المسجلين</h3>
                <div class="number" id="totalStudents">0</div>
            </div>
            <div class="stat-card">
                <h3>الحالات المعتمدة</h3>
                <div class="number" id="approvedStudents">0</div>
            </div>
            <div class="stat-card">
                <h3>قيد المراجعة</h3>
                <div class="number" id="pendingStudents">0</div>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>اسم الطالب</th>
                        <th>الصف الدراسي</th>
                        <th>المركز</th>
                        <th>رقم الهاتف</th>
                        <th>الحالة المالية</th>
                        <th>طريقة الدفع</th>
                        <th>رقم المُحول منه</th>
                        <th>الإيصال / الإثبات</th>
                        <th>كود التفعيل</th>
                        <th>الباركود</th>
                        <th>الحالة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        function loadDashboard() {
            let students = JSON.parse(localStorage.getItem('atharStudents')) || [];
            let tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '';

            let approvedCount = 0;
            let pendingCount = 0;

            students.forEach((student, index) => {
                let isApproved = student.status === 'تم الدفع ومعتمد ✓' || student.isApproved;
                if (isApproved) approvedCount++;
                else pendingCount++;

                let receiptContent = student.fileImage ? `<img src="${student.fileImage}" class="receipt-img" title="إيصال الدفع" onclick="openModal('${student.fileImage}')">` : 'بدون';
                let proofContent = student.proofImage ? `<img src="${student.proofImage}" class="receipt-img" title="إثبات عدم القدرة" onclick="openModal('${student.proofImage}')" style="border-color:#a855f7;">` : '';

                let financialBadge = student.financialStatus === 'غير مقتدر' 
                    ? `<span class="badge-poor">غير مقتدر</span> ${proofContent}` 
                    : `<span class="badge-financial">مقتدر</span>`;

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${student.name}</strong></td>
                    <td>${student.grade}</td>
                    <td>${student.center || 'غير محدد'}</td>
                    <td>${student.phone}</td>
                    <td>${financialBadge}</td>
                    <td>${student.paymentMethod || 'فودافون كاش'}</td>
                    <td><span style="color: #60a5fa; font-weight: bold;">${student.senderPhone || '-'}</span></td>
                    <td>${receiptContent}</td>
                    <td><span style="color: #d4af37; font-weight: bold;">${student.code}</span></td>
                    <td>
                        <div class="qr-wrapper">
                            <div class="qr-box" id="qr_${index}"></div>
                            <button class="btn-download-qr" onclick="downloadQR(${index}, '${student.code}')">📥 تحميل</button>
                        </div>
                    </td>
                    <td><span class="${isApproved ? 'status-approved' : 'status-pending'}">${student.status || 'قيد المراجعة'}</span></td>
                    <td>
                        <div class="action-btns">
                            ${!isApproved ? `<button class="btn-approve" onclick="approve(${index})">تأكيد</button>` : '<span style="color:#10b981;font-weight:bold;font-size:11px;">معتمد</span>'}
                            <button class="btn-delete" onclick="del(${index})">حذف</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);

                setTimeout(() => {
                    let qrContainer = document.getElementById(`qr_${index}`);
                    if (qrContainer && qrContainer.childElementCount === 0) {
                        let baseUrl = window.location.origin + window.location.pathname.replace(/index\.html$/, '');
                        let encodedName = encodeURIComponent(student.name || '');
                        let encodedGrade = encodeURIComponent(student.grade || '');
                        let encodedCenter = encodeURIComponent(student.center || '');
                        let scanUrl = `${baseUrl}scan.html?code=${student.code}&name=${encodedName}&grade=${encodedGrade}&center=${encodedCenter}`;

                        let qr = new QRCode(qrContainer, {
                            text: scanUrl,
                            width: 60,
                            height: 60,
                            correctLevel: QRCode.CorrectLevel.M
                        });

                        qrContainer.onclick = () => window.open(scanUrl, '_blank');
                    }
                }, 100);
            });

            document.getElementById('totalStudents').innerText = students.length;
            document.getElementById('approvedStudents').innerText = approvedCount;
            document.getElementById('pendingStudents').innerText = pendingCount;
        }

        function approve(index) {
            let students = JSON.parse(localStorage.getItem('atharStudents')) || [];
            students[index].status = 'تم الدفع ومعتمد ✓';
            students[index].isApproved = true;
            students[index].approvalDate = new Date().toISOString();
            localStorage.setItem('atharStudents', JSON.stringify(students));
            loadDashboard();
        }

        function del(index) {
            let students = JSON.parse(localStorage.getItem('atharStudents')) || [];
            if (confirm("هل أنت متأكد من حذف هذا الطالب؟")) {
                students.splice(index, 1);
                localStorage.setItem('atharStudents', JSON.stringify(students));
                loadDashboard();
            }
        }

        function openModal(src) {
            let win = window.open();
            win.document.write(`<body style="background:#000;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;"><img src="${src}" style="max-width:100%;max-height:100%;"></body>`);
        }

        function downloadQR(index, code) {
            let qrElement = document.getElementById(`qr_${index}`);
            let img = qrElement.querySelector('img');
            let canvas = qrElement.querySelector('canvas');
            let url = img ? img.src : (canvas ? canvas.toDataURL("image/png") : '');
            if(url) {
                let a = document.createElement('a');
                a.href = url;
                a.download = `Card_QR_${code}.png`;
                a.click();
            }
        }

        function sendWhatsAppReport() {
            let students = JSON.parse(localStorage.getItem('atharStudents')) || [];
            let total = students.length;
            let approved = students.filter(s => s.status === 'تم الدفع ومعتمد ✓' || s.isApproved).length;
            let pending = total - approved;

            let reportText = `📊 *تقرير منصة أثر التعليمية (إدارة سوهاج)* %0A` +
                             `-----------------------------------%0A` +
                             `📌 إجمالي المسجلين: ${total}%0A` +
                             `✅ الحالات المعتمدة: ${approved}%0A` +
                             `⏳ قيد المراجعة: ${pending}%0A` +
                             `-----------------------------------%0A` +
                             `🏛️ النقوش الهيروغليفية والخلفية تعمل بكفاءة.`;

            window.open(`https://wa.me/?text=${reportText}`, '_blank');
        }

        window.onload = loadDashboard;
    </script>
</body>
</html>
